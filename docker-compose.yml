services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kalon_db
      POSTGRES_USER: kalon
      POSTGRES_PASSWORD: kalon
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalon -d kalon_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kalon_db
      SPRING_DATASOURCE_USERNAME: kalon
      SPRING_DATASOURCE_PASSWORD: kalon
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost
      # Fresh DB: Hibernate creates schema (no V1 migration); Flyway disabled for first run
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_FLYWAY_ENABLED: "false"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8082/api
    ports:
      - "5173:80"

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8082/api
    ports:
      - "5174:80"

volumes:
  postgres_data:
  backend_uploads:
