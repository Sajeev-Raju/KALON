# Production Profile Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

logging.level.com.kalon=INFO
logging.level.org.springframework.security=WARN

# Strict rate limiting for production
rate-limit.enabled=true
rate-limit.requests-per-minute=60
rate-limit.auth-requests-per-minute=10

# Security - require these env vars in production
# JWT_SECRET must be set
# RAZORPAY_KEY_ID must be set
# RAZORPAY_KEY_SECRET must be set

# Actuator security in production
management.endpoint.health.show-details=never
