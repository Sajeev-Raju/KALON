# Application Name
spring.application.name=kalon-backend

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kalon_db
spring.datasource.username=sajeev
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema created by Hibernate

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# CORS Configuration (comma-separated list of allowed origins)
# Override with CORS_ALLOWED_ORIGINS env variable in production
# Example production: CORS_ALLOWED_ORIGINS=https://kalon.com,https://www.kalon.com,https://admin.kalon.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# Rate Limiting Configuration
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS:60}
rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS:10}

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
razorpay.currency=${RAZORPAY_CURRENCY:INR}
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:}

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender display
mail.from-address=${MAIL_FROM:noreply@kalon.com}
mail.from-name=${MAIL_FROM_NAME:KALON}
mail.enabled=${EMAIL_ENABLED:true}

# Frontend URL (for email links)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Password reset token expiry (milliseconds) - 1 hour
app.password-reset-token-expiry-ms=3600000

# Thymeleaf
spring.thymeleaf.check-template-location=true

# Logging
logging.level.com.kalon=DEBUG
logging.level.org.springframework.security=DEBUG

# Spring Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# Tax (GST) Configuration
tax.enabled=${TAX_ENABLED:true}
tax.gst.rate=${GST_RATE:18}
tax.inclusive=${TAX_INCLUSIVE:true}

# Company Information (for invoices)
app.company.name=${COMPANY_NAME:KALON}
app.company.address=${COMPANY_ADDRESS:India}
app.company.gstin=${COMPANY_GSTIN:}
