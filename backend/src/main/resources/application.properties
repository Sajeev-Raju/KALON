# Application Name
spring.application.name=kalon-backend

# Server Configuration
server.port=8080

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/kalon_db
spring.datasource.username=sajeev
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing schema created by Hibernate

# JWT Configuration
jwt.secret=${JWT_SECRET:kalonSecretKeyForJWTTokenGenerationAndValidation2024VerySecureKey}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# Google OAuth Configuration
google.client-id=${GOOGLE_CLIENT_ID:}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# CORS Configuration (comma-separated list of allowed origins)
# Override with CORS_ALLOWED_ORIGINS env variable in production
# Example production: CORS_ALLOWED_ORIGINS=https://kalon.com,https://www.kalon.com,https://admin.kalon.com
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174}

# Rate Limiting Configuration
rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS:60}
rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS:10}

# Razorpay Configuration
razorpay.key.id=your_razorpay_key_id
razorpay.key.secret=your_razorpay_key_secret
razorpay.currency=INR
razorpay.webhook.secret=your_razorpay_webhook_secret

# Email (SMTP) Configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email sender display
mail.from-address=${MAIL_FROM:noreply@kalon.com}
mail.from-name=${MAIL_FROM_NAME:KALON}
mail.enabled=${EMAIL_ENABLED:true}

# Frontend URL (for email links)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Password reset token expiry (milliseconds) - 1 hour
app.password-reset-token-expiry-ms=3600000

# Thymeleaf
spring.thymeleaf.check-template-location=true

# Logging
logging.level.com.kalon=DEBUG
logging.level.org.springframework.security=DEBUG
