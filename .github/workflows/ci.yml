name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kalon_test_db
          POSTGRES_USER: kalon
          POSTGRES_PASSWORD: kalon
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build Backend
        working-directory: ./backend
        run: mvn clean package -DskipTests
        env:
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long

      - name: Run Tests
        working-directory: ./backend
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/kalon_test_db
          SPRING_DATASOURCE_USERNAME: kalon
          SPRING_DATASOURCE_PASSWORD: kalon
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          SPRING_FLYWAY_ENABLED: false
          JWT_SECRET: ci-test-secret-key-minimum-32-characters-long

  frontend:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api

  admin-frontend:
    name: Admin Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./admin-frontend
        run: npm ci

      - name: Lint
        working-directory: ./admin-frontend
        run: npm run lint

      - name: Build
        working-directory: ./admin-frontend
        run: npm run build
        env:
          VITE_API_URL: http://localhost:8080/api
